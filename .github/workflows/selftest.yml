name: selftest

# The project's own gate, run where forgetting is not an option. Until now
# `bash scripts/selftest.sh` on someone's laptop was the only thing between a
# regression and main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A manual dispatch and the push it was meant to double-check share a ref, so a
# single group let the dispatch cancel the run that actually gates main: on
# 2026-08-26 fb3582c was green on all five jobs via dispatch and showed
# `cancelled` on the branch. The event belongs in the key.
concurrency:
  group: selftest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY, not the default shallow clone. tests/orphan-sweep.test.mjs
        # proves the sweep can FAIL by running it over the two commits that
        # actually shipped an orphan (dcb7df4, cb45a39^). A depth-1 checkout does
        # not have them, so the whole falsifiability half died with
        # `fatal: Not a valid object name dcb7df4` — green locally, red on all
        # four platforms. A proof that only runs on the author's machine is the
        # defect CLAUDE.md §8 names, one step over: the answer depended on which
        # clone was asking.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The gates are `#!/usr/bin/env python3` scripts invoked by name through
      # PATH, so the interpreter has to answer to that exact name.
      - name: Confirm the toolchain the gates assume
        run: |
          node --version
          python3 --version
          bash --version | head -1
      # selftest.sh runs `claude plugin validate` when the CLI is present and
      # downgrades to PARTIAL when it is not. REQUIRE_CLI=1 below turns that
      # absence into a failure, so this job has to actually install it — setting
      # the flag without this step is what made both selftest jobs red on
      # b144d22. PARTIAL is for a laptop, not for CI.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the project's own check
        env:
          QUALITY_HARNESS_REQUIRE_CLI: '1'
        run: bash scripts/selftest.sh

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY, not the default shallow clone. tests/orphan-sweep.test.mjs
        # proves the sweep can FAIL by running it over the two commits that
        # actually shipped an orphan (dcb7df4, cb45a39^). A depth-1 checkout does
        # not have them, so the whole falsifiability half died with
        # `fatal: Not a valid object name dcb7df4` — green locally, red on all
        # four platforms. A proof that only runs on the author's machine is the
        # defect CLAUDE.md §8 names, one step over: the answer depended on which
        # clone was asking.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coverage.py
        run: python3 -m pip install --upgrade coverage
      # STRICT=1 turns "the gates could not be measured" into a failure. A
      # coverage job that silently measures nothing is worse than no job.
      - name: Hold the coverage floor
        env:
          QUALITY_HARNESS_COVERAGE_STRICT: '1'
        run: bash scripts/coverage.sh

  windows:
    name: windows
    runs-on: windows-latest
    # Blocking since 2026-08-25 (run 32885379301), the first green Windows run
    # this project has ever had. It went 13 -> 4 -> 1 -> 0 failures: most were
    # defects in the SUITE (bare-name gate spawns, `D:\…` paths split on "/",
    # POSIX permission bits a Git for Windows checkout does not have), but three
    # were the harness — a seal that called line-ending translation tampering, a
    # session orientation that silently said nothing, and a budget wall that
    # named no way over it. An informational job would have found all of that and
    # gated none of it.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY, not the default shallow clone. tests/orphan-sweep.test.mjs
        # proves the sweep can FAIL by running it over the two commits that
        # actually shipped an orphan (dcb7df4, cb45a39^). A depth-1 checkout does
        # not have them, so the whole falsifiability half died with
        # `fatal: Not a valid object name dcb7df4` — green locally, red on all
        # four platforms. A proof that only runs on the author's machine is the
        # defect CLAUDE.md §8 names, one step over: the answer depended on which
        # clone was asking.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the project's own check under Git Bash
        env:
          # BACKLOG §49: a Windows run failed once naming no subtest at all. The
          # TAP transcript names each subtest as it completes, so the next
          # occurrence says how far the file got. Uploaded below, on failure.
          QUALITY_HARNESS_TAP: selftest.tap
        run: bash scripts/selftest.sh
      - name: Keep the TAP transcript when the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selftest-tap
          path: selftest.tap
          if-no-files-found: warn

  mutations:
    name: mutations ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # Sharded, and timed out on purpose. The campaign went from 145 entries to
    # 268 in two days and its job was killed at thirty minutes on 2026-08-28
    # with exit 143 — which reads as infrastructure noise rather than as "this
    # gate outgrew its slot". An explicit timeout makes the difference legible,
    # and eight shards keep each one well inside it.
    #
    # ADR-023 T1: four -> eight on 2026-09-02. The campaign is ~80 minutes of
    # serial work at 430 entries, and index-sliced quarters came out 24.6 / 16.1
    # / 18.1 / 21.3 minutes — the run waits on the slowest. Doubling the matrix
    # changes no verdict and no total work; it only stops one shard being the
    # wall-clock. The three places this number appears are asserted to agree by
    # tests/package.test.mjs, because a job named `x/8` running `--shard x/4`
    # skips half the catalogue and still reports success.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # 145 catalogue entries that had never run anywhere but a laptop, in the
    # project whose own thesis is that a suite nobody runs is a claim. It is the
    # highest-value check here — it is the only one that measures whether the
    # other checks detect anything — and it was the only one not gating.
    #
    # ubuntu, deliberately. The Windows-shaped mutations break a CLASSIFIER's
    # string table (cmd.exe, PowerShell, Win32 and Docker Desktop failure text,
    # exits 126/127/9009), and a table maps the same on every host. What genuinely
    # needs Windows is resolution and process spawning, and the windows job runs
    # those — through cmd.exe and, since 2026-08-26, PowerShell.
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY, not the default shallow clone. tests/orphan-sweep.test.mjs
        # proves the sweep can FAIL by running it over the two commits that
        # actually shipped an orphan (dcb7df4, cb45a39^). A depth-1 checkout does
        # not have them, so the whole falsifiability half died with
        # `fatal: Not a valid object name dcb7df4` — green locally, red on all
        # four platforms. A proof that only runs on the author's machine is the
        # defect CLAUDE.md §8 names, one step over: the answer depended on which
        # clone was asking.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Break each mechanism and check the tests notice
        run: node scripts/mutate.mjs --shard ${{ matrix.shard }}/8

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    # Answered 2026-08-25: `claude plugin validate --strict` passes with no
    # credentials (run 32882955305 logged three `✔ Validation passed`). It is a
    # blocking job now, and selftest.sh runs with QUALITY_HARNESS_REQUIRE_CLI=1
    # above, so an absent CLI fails instead of quietly downgrading to PARTIAL.
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY, not the default shallow clone. tests/orphan-sweep.test.mjs
        # proves the sweep can FAIL by running it over the two commits that
        # actually shipped an orphan (dcb7df4, cb45a39^). A depth-1 checkout does
        # not have them, so the whole falsifiability half died with
        # `fatal: Not a valid object name dcb7df4` — green locally, red on all
        # four platforms. A proof that only runs on the author's machine is the
        # defect CLAUDE.md §8 names, one step over: the answer depended on which
        # clone was asking.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the manifest and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugin/.claude-plugin/plugin.json
          claude plugin validate --strict plugin/skills
