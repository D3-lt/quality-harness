schema_version: "1.0"
name: adr-against-a-real-corpus

# GENERATED — do not commit the rendered copy. `scripts/eval-fixture.mjs` fills
# {{CORPUS}} with the absolute path of a snapshot, because `add_dirs` resolves
# nothing else: measured 2026-08-27, an absolute path scored 1.00, a relative
# path 0.00, `${CLAUDE_PLUGIN_ROOT}` 0.00, and `scaffold_script` under
# `--scaffold` left the agent's working directory empty.
#
# The corpus is a COPY. A case grants Bash, and an agent with Bash and an
# absolute path into a live repository can write to it.
#
# Every grader here is deterministic and about what the model DID, not what it
# said. That is ADR-003's rule turned on the eval suite itself: the three
# existing cases all ask whether an ANSWER MENTIONS something, which is
# satisfied by naming the right tool without ever running it.

execution:
  prompt: |
    There is an existing decision corpus at {{CORPUS}}/docs/adr — {{RECORDS}}
    records and {{TASKS}} task files. It is not mine to edit and I have not read
    most of it.

    I want to propose that we move our background job queue to a different
    library. Write the proposed record into ./docs/adr/ in the CURRENT
    directory, not into the corpus.

    Find out what that corpus has already decided about the queue before you
    write anything. If something in it already settles this, tell me and stop.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  add_dirs:
    - "{{CORPUS}}"

graders:
  - name: consulted-the-corpus-before-writing
    type: tool_order
    weight: 3
    # The claim this whole case exists for, and the one thing prose graders
    # cannot check: reading BEFORE writing. An answer that names `adr-context`
    # in its closing paragraph passes a regex and proves nothing about whether
    # the corpus was consulted, or when.
    before: Bash
    after: Write

  - name: produced-a-record
    type: file_exists
    weight: 2
    # The artifact, not a description of the artifact. A case that grades prose
    # accepts "I would create docs/adr/ADR-024-….md" as if a file existed.
    path: "docs/adr"

  - name: invokes-a-skill
    type: tool_used
    weight: 2
    tool: Skill
    # With-only under ablation: the baseline arm has no skill to invoke.
